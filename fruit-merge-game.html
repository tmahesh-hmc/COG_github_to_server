<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Drop</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a0a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
  }

  #bg-stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }

  #game-wrapper {
    position: relative;
    display: flex;
    gap: 20px;
    align-items: flex-start;
    z-index: 1;
  }

  #side-panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 130px;
  }

  .panel-card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 14px 16px;
    color: white;
    text-align: center;
  }

  .panel-card .label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 4px;
  }

  .panel-card .value {
    font-family: 'Fredoka One', cursive;
    font-size: 28px;
    color: #ffe066;
    line-height: 1;
  }

  #next-card { padding: 12px; }
  #next-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px;
    text-align: center;
  }

  #evolution-card { padding: 10px; }
  #evolution-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-top: 6px;
  }
  .evo-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: rgba(255,255,255,0.6);
  }
  .evo-dot {
    width: 12px; height: 12px; border-radius: 50%;
    flex-shrink: 0;
  }

  #canvas-container {
    position: relative;
  }

  #game-canvas {
    display: block;
    border-radius: 0 0 20px 20px;
    cursor: crosshair;
  }

  #drop-indicator {
    position: absolute;
    top: 0;
    width: 2px;
    height: 100%;
    pointer-events: none;
    border-left: 2px dashed rgba(255,255,255,0.2);
    transform: translateX(-50%);
    transition: left 0.05s;
  }

  #danger-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: rgba(255, 80, 80, 0.4);
    pointer-events: none;
  }

  #hud-top {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: white;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    letter-spacing: 0.04em;
  }

  .fruit-emoji { font-size: 20px; }

  #game-over-screen {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(10, 4, 24, 0.88);
    border-radius: 0 0 20px 20px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 100;
  }

  #game-over-screen.visible { display: flex; }

  #game-over-screen h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 42px;
    color: #ff6b6b;
  }

  #game-over-screen .final-score {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: #ffe066;
  }

  #restart-btn {
    background: linear-gradient(135deg, #ff6b6b, #ff8e53);
    border: none;
    border-radius: 30px;
    padding: 12px 32px;
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    color: white;
    cursor: pointer;
    transition: transform 0.1s;
  }
  #restart-btn:hover { transform: scale(1.05); }
  #restart-btn:active { transform: scale(0.97); }

  .merge-pop {
    position: absolute;
    pointer-events: none;
    font-family: 'Fredoka One', cursive;
    font-size: 14px;
    color: #ffe066;
    text-shadow: 0 0 8px rgba(255,224,102,0.8);
    animation: pop-anim 0.8s forwards;
    z-index: 50;
    white-space: nowrap;
  }

  @keyframes pop-anim {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    60%  { opacity: 1; transform: translateY(-24px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-40px) scale(0.9); }
  }
</style>
</head>
<body>

<canvas id="bg-stars"></canvas>

<div id="game-wrapper">
  <div id="side-panel">
    <div class="panel-card">
      <div class="label">Score</div>
      <div class="value" id="score-display">0</div>
    </div>
    <div class="panel-card">
      <div class="label">Best</div>
      <div class="value" id="best-display">0</div>
    </div>
    <div class="panel-card" id="next-card">
      <div id="next-label">Next</div>
      <canvas id="next-canvas" width="80" height="80" style="display:block;margin:auto;"></canvas>
    </div>
    <div class="panel-card" id="evolution-card">
      <div class="label" style="text-align:left;margin-bottom:6px;">Fruits</div>
      <div id="evolution-grid"></div>
    </div>
  </div>

  <div id="canvas-container">
    <div id="hud-top">
      <span class="fruit-emoji">🍓</span> Fruit Drop <span class="fruit-emoji">🍉</span>
    </div>
    <div id="drop-indicator"></div>
    <div id="danger-line"></div>
    <canvas id="game-canvas"></canvas>
    <div id="game-over-screen">
      <h2>Game Over!</h2>
      <div class="final-score" id="final-score-text">Score: 0</div>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>
</div>

<script>
const FRUITS = [
  { name:'Blueberry', r:14, color:'#6A5ACD', dark:'#483D8B', emoji:'🫐', score:1 },
  { name:'Cherry',    r:18, color:'#DC143C', dark:'#A50E2D', emoji:'🍒', score:3 },
  { name:'Grape',     r:22, color:'#8B5CF6', dark:'#6D28D9', emoji:'🍇', score:6 },
  { name:'Strawberry',r:27, color:'#FF4757', dark:'#C0392B', emoji:'🍓', score:10 },
  { name:'Lemon',     r:33, color:'#FFD700', dark:'#B8960C', emoji:'🍋', score:15 },
  { name:'Orange',    r:40, color:'#FF8C00', dark:'#CC6600', emoji:'🍊', score:21 },
  { name:'Apple',     r:47, color:'#FF3B3B', dark:'#CC0000', emoji:'🍎', score:28 },
  { name:'Pear',      r:54, color:'#90EE90', dark:'#3A8C3A', emoji:'🍐', score:36 },
  { name:'Peach',     r:62, color:'#FFAB91', dark:'#BF5E3C', emoji:'🍑', score:45 },
  { name:'Pineapple', r:71, color:'#FFD54F', dark:'#F57F17', emoji:'🍍', score:55 },
  { name:'Watermelon',r:82, color:'#4CAF50', dark:'#1B5E20', emoji:'🍉', score:66 },
];

const W = 380, H = 520;
const WALL_T = 20;
const DROP_Y = 60;
const DANGER_Y = 80;

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

const nextCanvas = document.getElementById('next-canvas');
const nextCtx = nextCanvas.getContext('2d');

const dangerLine = document.getElementById('danger-line');
dangerLine.style.top = DANGER_Y + 'px';

const scoreDisplay = document.getElementById('score-display');
const bestDisplay = document.getElementById('best-display');
const dropIndicator = document.getElementById('drop-indicator');
const gameOverScreen = document.getElementById('game-over-screen');
const finalScoreText = document.getElementById('final-score-text');

let score = 0, best = 0, gameActive = true;
let mouseX = W / 2;
let pendingFruitIdx = 0, nextFruitIdx = 0;
let canDrop = true;
let dropCooldown = false;
const DROP_DELAY = 600;

const { Engine, Render: MRender, Runner, Bodies, Body, World, Events, Vector } = Matter;

let engine, world, runner;
let bodies = [];

function randomFruitIdx(maxIdx = 4) {
  return Math.floor(Math.random() * (maxIdx + 1));
}

function initPhysics() {
  engine = Engine.create({ gravity: { y: 2.2 } });
  world = engine.world;

  const wallOpts = { isStatic: true, friction: 0.3, restitution: 0.2, render: { visible: false } };
  const floor  = Bodies.rectangle(W/2, H + WALL_T/2, W, WALL_T, wallOpts);
  const wallL  = Bodies.rectangle(-WALL_T/2, H/2, WALL_T, H*2, wallOpts);
  const wallR  = Bodies.rectangle(W + WALL_T/2, H/2, WALL_T, H*2, wallOpts);

  World.add(world, [floor, wallL, wallR]);

  Events.on(engine, 'collisionStart', onCollision);
}

let mergeQueue = [];
let processingMerge = false;

function onCollision(event) {
  const pairs = event.pairs;
  for (const pair of pairs) {
    const a = pair.bodyA, b = pair.bodyB;
    if (a.fruitIdx !== undefined && b.fruitIdx !== undefined &&
        a.fruitIdx === b.fruitIdx && !a.merging && !b.merging) {
      const idx = a.fruitIdx;
      if (idx < FRUITS.length - 1) {
        a.merging = true;
        b.merging = true;
        mergeQueue.push({ a, b, idx });
      }
    }
  }
}

function processMerges() {
  while (mergeQueue.length > 0) {
    const { a, b, idx } = mergeQueue.shift();
    if (!bodies.includes(a) || !bodies.includes(b)) continue;

    const mx = (a.position.x + b.position.x) / 2;
    const my = (a.position.y + b.position.y) / 2;

    removeFruitBody(a);
    removeFruitBody(b);

    const newIdx = idx + 1;
    spawnFruit(mx, my, newIdx, true);

    const pts = FRUITS[newIdx].score;
    score += pts;
    scoreDisplay.textContent = score;
    if (score > best) { best = score; bestDisplay.textContent = best; }

    showMergePop(mx, my, '+' + pts + ' ' + FRUITS[newIdx].emoji);
  }
}

function removeFruitBody(body) {
  World.remove(world, body);
  const i = bodies.indexOf(body);
  if (i !== -1) bodies.splice(i, 1);
}

function spawnFruit(x, y, idx, fromMerge = false) {
  const f = FRUITS[idx];
  const body = Bodies.circle(x, y, f.r, {
    restitution: 0.25,
    friction: 0.5,
    frictionAir: 0.008,
    density: 0.003 + idx * 0.0004,
    label: 'fruit'
  });
  body.fruitIdx = idx;
  body.merging = false;
  if (fromMerge) {
    Body.setVelocity(body, { x: (Math.random()-0.5)*2, y: -3 });
  }
  World.add(world, body);
  bodies.push(body);
  return body;
}

function dropFruit() {
  if (!gameActive || dropCooldown) return;
  dropCooldown = true;
  const clampedX = Math.max(FRUITS[pendingFruitIdx].r + WALL_T, Math.min(W - FRUITS[pendingFruitIdx].r - WALL_T, mouseX));
  spawnFruit(clampedX, DROP_Y, pendingFruitIdx);

  pendingFruitIdx = nextFruitIdx;
  nextFruitIdx = randomFruitIdx(4);
  drawNextFruit();

  setTimeout(() => { dropCooldown = false; }, DROP_DELAY);
}

function drawFruit(context, x, y, idx, alpha=1) {
  const f = FRUITS[idx];
  context.save();
  context.globalAlpha = alpha;

  const grad = context.createRadialGradient(x - f.r*0.3, y - f.r*0.3, f.r*0.05, x, y, f.r);
  grad.addColorStop(0, lighten(f.color, 40));
  grad.addColorStop(0.6, f.color);
  grad.addColorStop(1, f.dark);

  context.beginPath();
  context.arc(x, y, f.r, 0, Math.PI*2);
  context.fillStyle = grad;
  context.fill();
  context.strokeStyle = f.dark;
  context.lineWidth = 1.5;
  context.stroke();

  context.font = `${Math.max(10, f.r * 1.05)}px serif`;
  context.textAlign = 'center';
  context.textBaseline = 'middle';
  context.fillText(f.emoji, x, y + 1);

  context.restore();
}

function lighten(hex, amount) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, (num >> 16) + amount);
  const g = Math.min(255, ((num >> 8) & 0xFF) + amount);
  const b = Math.min(255, (num & 0xFF) + amount);
  return `rgb(${r},${g},${b})`;
}

function drawNextFruit() {
  nextCtx.clearRect(0, 0, 80, 80);
  drawFruit(nextCtx, 40, 40, nextFruitIdx);
}

function drawDropPreview() {
  if (!gameActive || dropCooldown) return;
  const f = FRUITS[pendingFruitIdx];
  const cx = Math.max(f.r + WALL_T, Math.min(W - f.r - WALL_T, mouseX));
  drawFruit(ctx, cx, DROP_Y, pendingFruitIdx, 0.6);

  ctx.beginPath();
  ctx.setLineDash([4, 6]);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.moveTo(cx, DROP_Y + f.r);
  ctx.lineTo(cx, H);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawWalls() {
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fillRect(0, 0, WALL_T, H);
  ctx.fillRect(W - WALL_T, 0, WALL_T, H);
  ctx.fillRect(0, H - WALL_T, W, WALL_T);

  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(WALL_T, 0); ctx.lineTo(WALL_T, H);
  ctx.moveTo(W - WALL_T, 0); ctx.lineTo(W - WALL_T, H);
  ctx.moveTo(0, H - WALL_T); ctx.lineTo(W, H - WALL_T);
  ctx.stroke();
}

function checkGameOver() {
  for (const b of bodies) {
    if (b.position.y - FRUITS[b.fruitIdx].r < DANGER_Y && Math.abs(b.velocity.y) < 0.5) {
      return true;
    }
  }
  return false;
}

let gameOverTimer = null;

function gameLoop() {
  Engine.update(engine, 1000/60);
  processMerges();

  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#0d0820';
  ctx.fillRect(0, 0, W, H);

  drawWalls();

  ctx.strokeStyle = 'rgba(255,80,80,0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(WALL_T, DANGER_Y);
  ctx.lineTo(W - WALL_T, DANGER_Y);
  ctx.stroke();
  ctx.setLineDash([]);

  for (const b of bodies) {
    drawFruit(ctx, b.position.x, b.position.y, b.fruitIdx);
  }

  drawDropPreview();

  if (gameActive && checkGameOver()) {
    if (!gameOverTimer) {
      gameOverTimer = setTimeout(() => {
        if (checkGameOver()) triggerGameOver();
      }, 1500);
    }
  } else {
    if (gameOverTimer) { clearTimeout(gameOverTimer); gameOverTimer = null; }
  }

  if (gameActive) requestAnimationFrame(gameLoop);
}

function triggerGameOver() {
  gameActive = false;
  finalScoreText.textContent = 'Score: ' + score;
  gameOverScreen.classList.add('visible');
}

function buildEvolutionGuide() {
  const grid = document.getElementById('evolution-grid');
  grid.innerHTML = '';
  FRUITS.forEach(f => {
    const item = document.createElement('div');
    item.className = 'evo-item';
    item.innerHTML = `<div class="evo-dot" style="background:${f.color}"></div><span>${f.emoji} ${f.name}</span>`;
    grid.appendChild(item);
  });
}

function initStars() {
  const sc = document.getElementById('bg-stars');
  sc.width = window.innerWidth;
  sc.height = window.innerHeight;
  const sctx = sc.getContext('2d');
  for (let i = 0; i < 160; i++) {
    const x = Math.random() * sc.width;
    const y = Math.random() * sc.height;
    const r = Math.random() * 1.5;
    sctx.beginPath();
    sctx.arc(x, y, r, 0, Math.PI*2);
    sctx.fillStyle = `rgba(255,255,255,${0.2 + Math.random()*0.5})`;
    sctx.fill();
  }
}

function showMergePop(x, y, text) {
  const container = document.getElementById('canvas-container');
  const el = document.createElement('div');
  el.className = 'merge-pop';
  el.textContent = text;
  el.style.left = (x + canvas.offsetLeft - 20) + 'px';
  el.style.top = (y + canvas.offsetTop - 20) + 'px';
  container.appendChild(el);
  setTimeout(() => el.remove(), 850);
}

function startGame() {
  bodies = [];
  score = 0;
  scoreDisplay.textContent = '0';
  gameActive = true;
  dropCooldown = false;
  gameOverTimer = null;
  mergeQueue = [];
  gameOverScreen.classList.remove('visible');

  if (engine) {
    Runner.stop(runner);
    World.clear(world);
    Engine.clear(engine);
  }

  initPhysics();

  pendingFruitIdx = randomFruitIdx(4);
  nextFruitIdx = randomFruitIdx(4);
  drawNextFruit();

  requestAnimationFrame(gameLoop);
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  const f = FRUITS[pendingFruitIdx];
  const cx = Math.max(f.r + WALL_T, Math.min(W - f.r - WALL_T, mouseX));
  dropIndicator.style.left = (cx + canvas.offsetLeft) + 'px';
});

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  dropFruit();
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  mouseX = e.touches[0].clientX - rect.left;
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  mouseX = e.changedTouches[0].clientX - rect.left;
  dropFruit();
}, { passive: false });

document.getElementById('restart-btn').addEventListener('click', startGame);

buildEvolutionGuide();
initStars();
startGame();
</script>
</body>
</html>
